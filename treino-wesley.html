<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Treino Wesley — Hipertrofia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D1117;--surface:#161B22;--surface2:#1C2128;--surface3:#22272E;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#E6EDF3;--muted:#7D8590;--dim:#484F58;
  --red:#EF4444;--blue:#3B82F6;--green:#22C55E;--amber:#F59E0B;
  --purple:#A855F7;--cyan:#06B6D4;--pink:#EC4899;
  --accent:#EF4444;
  --nav-h:56px;
}
html{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;scroll-behavior:smooth}
body{min-height:100vh;padding-bottom:calc(var(--nav-h) + 2rem)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:99px}

/* ── Header ── */
.app-header{
  background:rgba(13,17,23,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:.85rem 1rem .5rem;
  position:sticky;top:0;z-index:100;
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem}
.header-brand{font-size:1rem;font-weight:800;letter-spacing:-.3px}
.header-brand span{background:linear-gradient(90deg,#EF4444,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.reset-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--muted);font-size:.7rem;font-weight:600;padding:.3rem .65rem;border-radius:8px;cursor:pointer;}
.reset-btn:hover{color:var(--text);background:var(--surface3)}

/* ── Day Nav ── */
.day-nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none}
.day-nav::-webkit-scrollbar{display:none}
.day-btn{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:.4rem .6rem;border-radius:10px;background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:.65rem;font-weight:700;letter-spacing:.5px;
  transition:background .15s,color .15s;position:relative;
}
.day-btn:hover{background:var(--surface2);color:var(--text)}
.day-btn.active{background:var(--surface2);color:var(--text)}
.day-btn.active::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:99px;background:var(--accent-day,var(--red))}
.day-btn .done-dot{width:5px;height:5px;border-radius:50%;background:var(--green);position:absolute;top:4px;right:4px;display:none}
.day-btn.completed .done-dot{display:block}

/* ── Main ── */
.main{padding:1rem;max-width:640px;margin:0 auto}
.day-panel{display:none;animation:fadeUp .2s ease}
.day-panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── Day Header ── */
.day-header{border-radius:16px;padding:1.25rem 1.25rem 1rem;margin-bottom:1rem;border:1px solid var(--border);position:relative;overflow:hidden;}
.day-header::before{content:'';position:absolute;inset:0;background:var(--day-gradient);opacity:.12;}
.day-header-content{position:relative}
.day-badge{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.08);border:1px solid var(--border2);padding:.2rem .6rem;border-radius:99px;font-size:.62rem;font-weight:800;letter-spacing:1px;color:var(--day-color);margin-bottom:.5rem;}
.day-title{font-size:1.5rem;font-weight:900;letter-spacing:-.5px;margin-bottom:.15rem}
.day-subtitle{font-size:.8rem;color:var(--muted)}
.day-meta{display:flex;gap:.75rem;margin-top:.75rem;font-size:.72rem;color:var(--muted)}
.day-meta span{display:flex;align-items:center;gap:.25rem}

/* ── Progress ── */
.day-progress{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;margin-bottom:1rem;}
.progress-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem}
.progress-label{font-size:.75rem;font-weight:700}
.progress-pct{font-size:.72rem;color:var(--muted)}
.progress-bar-wrap{height:6px;background:var(--surface3);border-radius:99px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:99px;background:var(--day-gradient);transition:width .4s cubic-bezier(.4,0,.2,1);}
.progress-counts{display:flex;justify-content:space-between;margin-top:.4rem;font-size:.68rem;color:var(--muted)}

/* ── Muscle Group ── */
.muscle-group{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:.85rem;overflow:hidden;}
.group-header{display:flex;align-items:center;gap:.65rem;padding:.9rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
.group-icon{font-size:1.2rem;line-height:1;flex-shrink:0}
.group-info{flex:1;min-width:0}
.group-name{font-size:.88rem;font-weight:800;color:var(--text)}
.group-count{font-size:.7rem;color:var(--muted);margin-top:1px}
.group-badge{font-size:.58rem;font-weight:800;letter-spacing:.8px;padding:.18rem .55rem;border-radius:99px;white-space:nowrap;flex-shrink:0;}
.badge-priority{background:rgba(239,68,68,.15);color:#EF4444;border:1px solid rgba(239,68,68,.3)}
.badge-superset{background:rgba(168,85,247,.15);color:#A855F7;border:1px solid rgba(168,85,247,.3)}
.badge-volume{background:rgba(59,130,246,.15);color:#60A5FA;border:1px solid rgba(59,130,246,.3)}
.badge-power{background:rgba(245,158,11,.15);color:#F59E0B;border:1px solid rgba(245,158,11,.3)}
.group-toggle{color:var(--muted);font-size:.9rem;transition:transform .2s;flex-shrink:0}
.group-collapsed .group-toggle{transform:rotate(-90deg)}
.group-collapsed .group-body{display:none}
.group-progress-line{height:3px;background:var(--group-color,var(--red));transition:width .3s ease;border-radius:0}
.group-body{padding:.5rem .6rem .6rem}

/* ── Exercise Card ── */
.exercise-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:12px;
  margin-top:.4rem;overflow:hidden;transition:border-color .2s;
}
.exercise-card:hover{border-color:var(--border2)}
.exercise-card.done{opacity:.55;background:rgba(34,197,94,.04);border-color:rgba(34,197,94,.15);}
.exercise-card.done .ex-name{text-decoration:line-through;color:var(--muted)}

.ex-main-row{display:flex;align-items:flex-start;gap:.7rem;padding:.75rem .9rem .5rem;cursor:pointer;}
.ex-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border2);background:none;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;}
.exercise-card.done .ex-check{background:var(--green);border-color:var(--green);}
.ex-check-mark{color:#fff;font-size:.75rem;opacity:0;transition:opacity .2s}
.exercise-card.done .ex-check-mark{opacity:1}
.ex-content{flex:1;min-width:0}
.ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.35rem}
.ex-name{font-size:.88rem;font-weight:700;color:var(--text);line-height:1.3}
.ex-technique{font-size:.55rem;font-weight:800;letter-spacing:.7px;padding:.15rem .45rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:1px;}
.tech-drop{background:rgba(239,68,68,.2);color:#EF4444;border:1px solid rgba(239,68,68,.35)}
.tech-rest{background:rgba(245,158,11,.2);color:#F59E0B;border:1px solid rgba(245,158,11,.35)}
.tech-super{background:rgba(168,85,247,.2);color:#A855F7;border:1px solid rgba(168,85,247,.35)}
.tech-giant{background:rgba(236,72,153,.2);color:#EC4899;border:1px solid rgba(236,72,153,.35)}
.tech-heavy{background:rgba(6,182,212,.2);color:#06B6D4;border:1px solid rgba(6,182,212,.35)}
.tech-prog{background:rgba(34,197,94,.2);color:#22C55E;border:1px solid rgba(34,197,94,.35)}
.ex-stats{display:flex;flex-wrap:wrap;gap:.4rem .8rem}
.ex-stat{display:flex;align-items:center;gap:.25rem;font-size:.72rem;color:var(--muted);}
.ex-stat-val{font-weight:600;color:var(--text)}
.ex-tip{margin:.35rem .9rem .5rem;padding:.4rem .6rem;background:rgba(255,255,255,.03);border-left:2px solid var(--border2);border-radius:0 6px 6px 0;font-size:.7rem;color:var(--muted);line-height:1.45;}

/* ── Exercise Image Section ── */
.ex-img-section{
  margin:0 .6rem .6rem;border-radius:10px;overflow:hidden;
  border:1px solid var(--border);cursor:pointer;position:relative;
  background:var(--surface3);
}
.ex-img-section img{
  width:100%;height:160px;object-fit:cover;display:block;
  transition:transform .3s ease;
}
.ex-img-section:hover img{transform:scale(1.03)}
.ex-img-overlay{
  position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 50%);
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:.6rem .75rem;
}
.ex-img-label{font-size:.7rem;font-weight:700;color:#fff;opacity:.9}
.ex-img-btn{
  display:flex;align-items:center;gap:.3rem;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.2);color:#fff;
  font-size:.62rem;font-weight:700;padding:.25rem .55rem;border-radius:6px;
  cursor:pointer;white-space:nowrap;
}
.ex-img-placeholder{
  height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.4rem;color:var(--muted);font-size:.72rem;padding:1rem;
}
.ex-img-placeholder .ph-icon{font-size:1.5rem}
.ex-yt-btn{
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);
  color:#EF4444;font-size:.7rem;font-weight:700;padding:.3rem .75rem;border-radius:6px;
  cursor:pointer;width:100%;text-decoration:none;margin:.5rem 0 0;
}

/* ── Image Modal ── */
.img-modal{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
  padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.img-modal.open{opacity:1;pointer-events:auto}
.img-modal-sheet{
  background:var(--surface);border:1px solid var(--border2);border-radius:20px;
  max-width:480px;width:100%;max-height:92vh;overflow-y:auto;
  transform:translateY(20px);transition:transform .25s ease;scrollbar-width:thin;
}
.img-modal.open .img-modal-sheet{transform:none}
.img-modal-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px 20px 0 0;display:block;}
.img-modal-img.square{aspect-ratio:1}
.img-modal-body{padding:1rem 1.25rem 1.5rem}
.img-modal-title{font-size:1rem;font-weight:800;margin-bottom:.3rem}
.img-modal-badge{display:inline-block;font-size:.62rem;font-weight:700;padding:.18rem .55rem;border-radius:99px;margin-bottom:.75rem}
.img-modal-section{font-size:.65rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:.75rem 0 .35rem}
.img-modal-tip{font-size:.82rem;color:var(--muted);line-height:1.6;padding:.6rem .75rem;background:var(--surface2);border-radius:8px;margin-bottom:.75rem}
.img-modal-yt{
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff;
  font-size:.82rem;font-weight:700;padding:.7rem 1.25rem;border-radius:10px;
  text-decoration:none;width:100%;margin-bottom:.5rem;
}
.img-modal-close{
  display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  font-size:.8rem;font-weight:600;padding:.55rem;border-radius:10px;
  width:100%;cursor:pointer;margin-top:.25rem;
}
.img-modal-close:hover{color:var(--text)}
.modal-no-img{
  height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.5rem;font-size:2.5rem;border-radius:20px 20px 0 0;
  background:linear-gradient(135deg,var(--surface2),var(--surface3));
}
.modal-no-img p{font-size:.75rem;color:var(--muted)}

/* ── Completion Banner ── */
.completion-banner{display:none;background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(6,182,212,.1));border:1px solid rgba(34,197,94,.3);border-radius:16px;padding:1.25rem;text-align:center;margin-bottom:1rem;animation:fadeUp .4s ease;}
.completion-banner.show{display:block}
.completion-icon{font-size:2rem;margin-bottom:.4rem}
.completion-title{font-size:1rem;font-weight:800;color:var(--green);margin-bottom:.25rem}
.completion-sub{font-size:.8rem;color:var(--muted)}

/* ── Rest Card ── */
.rest-card{text-align:center;padding:3rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;}
.rest-icon{font-size:3rem;margin-bottom:.75rem}
.rest-title{font-size:1.1rem;font-weight:800;margin-bottom:.4rem}
.rest-sub{font-size:.8rem;color:var(--muted)}

/* ── Bottom Bar ── */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,17,23,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:.5rem .75rem;padding-bottom:calc(.5rem + env(safe-area-inset-bottom));display:flex;gap:.4rem;align-items:center;justify-content:space-between;z-index:200;}
.bb-info{display:flex;flex-direction:column;font-size:.68rem;color:var(--muted);min-width:0;flex:1;}
.bb-info-title{font-weight:700;color:var(--text);font-size:.75rem}
.bb-actions{display:flex;gap:.5rem;flex-shrink:0}
.bb-btn{display:flex;align-items:center;gap:.3rem;padding:.45rem .85rem;border-radius:10px;font-size:.72rem;font-weight:700;border:none;cursor:pointer;transition:opacity .2s,transform .15s;}
.bb-btn:active{transform:scale(.96)}
.bb-btn-day{background:var(--surface2);color:var(--text);border:1px solid var(--border2);}
.bb-btn-done{background:linear-gradient(135deg,var(--green),#16A34A);color:#fff;}

@media(min-width:600px){.main{padding:1.25rem 1.5rem}.day-title{font-size:1.75rem}}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <div class="header-brand">🏋️ <span>Wesley</span> — Hipertrofia</div>
    <button class="reset-btn" onclick="resetAll()">🔄 Semana</button>
  </div>
  <nav class="day-nav" id="dayNav"></nav>
</header>

<main class="main" id="mainContent"></main>

<div class="bottom-bar" id="bottomBar" style="display:none">
  <div class="bb-info">
    <div class="bb-info-title" id="bbTitle">—</div>
    <div class="bb-info-sub" id="bbSub">0 / 0 exercícios</div>
  </div>
  <div class="bb-actions">
    <button class="bb-btn bb-btn-day" onclick="resetDay()">🔄 Reiniciar</button>
    <button class="bb-btn bb-btn-done" onclick="markAllDone()">✓ Concluir tudo</button>
  </div>
</div>

<!-- ══ IMAGE MODAL ══ -->
<div class="img-modal" id="imgModal" onclick="handleModalClick(event)">
  <div class="img-modal-sheet" id="imgModalSheet">
    <div id="imgModalImgWrap"></div>
    <div class="img-modal-body">
      <div class="img-modal-title" id="imgModalTitle"></div>
      <div class="img-modal-badge" id="imgModalBadge"></div>
      <div class="img-modal-section">💡 Como executar</div>
      <div class="img-modal-tip" id="imgModalTip"></div>
      <a class="img-modal-yt" id="imgModalYt" target="_blank" rel="noopener">
        ▶ Ver tutorial no YouTube
      </a>
      <button class="img-modal-close" onclick="closeModal()">✕ Fechar</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   IMAGENS — Mapeadas do free-exercise-db (GitHub público)
   Base: raw.githubusercontent.com/yuhonas/free-exercise-db/
         main/exercises/{FOLDER}/images/0.jpg
   Formato "gh:FOLDER" ou "yt:BUSCA" como fallback
══════════════════════════════════════════════════════ */
const GH = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';

function imgUrl(code){
  if(!code) return null;
  if(code.startsWith('gh:')) return GH + code.slice(3) + '/images/0.jpg';
  return null;
}
function ytUrl(name){
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent('como fazer ' + name + ' academia musculação');
}

/* ══════════════════════════════════════════════════════
   TREINO DATA
══════════════════════════════════════════════════════ */
const TREINO = {

      {

  terca:{
    label:'TER',dayName:'Terça-feira',tipo:'PUXAR A',subtitulo:'Costas · Bíceps · Post. Ombro',
    cor:'#3B82F6',gradient:'linear-gradient(135deg,#3B82F6,#06B6D4)',icon:'💙',
    grupos:[
      {

const DAYS_ORDER=['segunda','terca','quarta','quinta','sexta','sabado','domingo'];
let currentDay='segunda';

function lsKey(day,idx){return `tw_${day}_${idx}`;}
function isDone(day,idx){return localStorage.getItem(lsKey(day,idx))==='1';}
function setDone(day,idx,v){localStorage.setItem(lsKey(day,idx),v?'1':'0');}
function getDayProgress(dayId){
  const d=TREINO[dayId];if(!d||d.rest)return{done:0,total:0};
  let total=0,done=0,gi=0;
  d.grupos.forEach(g=>g.exercicios.forEach(()=>{total++;if(isDone(dayId,gi++))done++;}));
  return{done,total};
}

   MODAL
══════════════════════════════════════════════════════ */
function openModal(name,imgCode,tip,muscle){
  const m=document.getElementById('imgModal');
  const wrap=document.getElementById('imgModalImgWrap');
  const url=imgUrl(imgCode);

  // Badge color
  const colors={'PEITO':'#EF4444','COSTAS':'#3B82F6','BÍCEPS':'#22C55E','OMBRO':'#A855F7','TRÍCEPS':'#EC4899','QUADRÍCEPS':'#F59E0B','POST. COXA + GLÚTEOS':'#EC4899','PANTURRILHA + ADUTORES':'#06B6D4','PERNA LEVE':'#06B6D4','POST. OMBRO':'#06B6D4'};
  const col=colors[muscle]||'#7D8590';

  document.getElementById('imgModalTitle').textContent=name;
  document.getElementById('imgModalBadge').textContent=muscle||'';
  document.getElementById('imgModalBadge').style.cssText=`background:${col}22;color:${col};border:1px solid ${col}44;border-radius:99px;font-size:.62rem;font-weight:700;padding:.18rem .55rem`;
  document.getElementById('imgModalTip').textContent=tip||'—';
  document.getElementById('imgModalYt').href=ytUrl(name);

  if(url){
    wrap.innerHTML=`<img class="img-modal-img" src="${url}" alt="${name}" onerror="handleImgError(this,'${name}','${muscle||''}')" />`;
  }else{
    wrap.innerHTML=`<div class="modal-no-img" style="background:linear-gradient(135deg,${col}22,${col}11)">
      <span style="font-size:2.5rem">🏋️</span>
      <p style="color:${col};font-weight:700;font-size:.8rem">${name}</p>
      <p>Veja o tutorial no YouTube</p>
    </div>`;
  }
  m.classList.add('open');
  document.body.style.overflow='hidden';
}

function handleImgError(img,name,muscle){
  img.parentElement.innerHTML=`<div class="modal-no-img">
    <span style="font-size:2.5rem">🏋️</span>
    <p style="font-weight:700;font-size:.8rem;color:var(--text)">${name}</p>
    <p>Veja o tutorial no YouTube abaixo</p>
  </div>`;
}

function closeModal(){
  document.getElementById('imgModal').classList.remove('open');
  document.body.style.overflow='';
}

function handleModalClick(e){
  if(e.target===document.getElementById('imgModal')) closeModal();
}

/* ══════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════ */
function techniqueBadge(t){
  if(!t) return '';
  const map={DROP:['tech-drop','DROP SET'],REST:['tech-rest','REST-PAUSE'],SUPER:['tech-super','SUPERSET'],GIANT:['tech-giant','GIANT SET'],HEAVY:['tech-heavy','PESADO'],PROG:['tech-prog','PROGRESSÃO']};
  const[cls,label]=map[t]||['tech-prog',t];
  return `<span class="ex-technique ${cls}">${label}</span>`;
}

function renderExercise(ex, dayId, gi, groupName){
  const done=isDone(dayId,gi);
  const url=imgUrl(ex.img);
  const encodedTip=(ex.tip||'').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
  const encodedName=ex.nome.replace(/'/g,'&#39;').replace(/"/g,'&quot;');
  const encodedGroup=groupName.replace(/'/g,'&#39;').replace(/"/g,'&quot;');

  // Thumbnail section
  let imgSection='';
  if(url){
    imgSection=`
      <div class="ex-img-section" onclick="openModal('${encodedName}','${ex.img||''}','${encodedTip}','${encodedGroup}')">
        <img src="${url}" alt="${ex.nome}" loading="lazy" onerror="this.parentElement.querySelector('.ex-img-overlay').innerHTML='<div style=\\'display:flex;align-items:center;gap:.4rem;padding:.5rem .75rem;width:100%\\'><span>🏋️</span><a href=\\'${ytUrl(ex.nome)}\\' target=\\'_blank\\' style=\\'color:#EF4444;font-size:.72rem;font-weight:700;text-decoration:none\\'>▶ Ver no YouTube</a></div>';this.style.display=\\'none\\'" />
        <div class="ex-img-overlay">
          <span class="ex-img-label">📸 ${ex.nome.split(' ').slice(0,3).join(' ')}</span>
          <span class="ex-img-btn">🔍 Ampliar</span>
        </div>
      </div>`;
  }else{
    imgSection=`
      <div class="ex-img-section" style="background:none;border:none;margin:.2rem .6rem .4rem" onclick="openModal('${encodedName}','','${encodedTip}','${encodedGroup}')">
        <a class="ex-yt-btn" href="${ytUrl(ex.nome)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
          ▶ Ver como fazer no YouTube
        </a>
      </div>`;
  }

  return `
    <div class="exercise-card${done?' done':''}" id="ex-${dayId}-${gi}">
      <div class="ex-main-row" onclick="toggleExercise('${dayId}',${gi})">
        <div class="ex-check"><span class="ex-check-mark">✓</span></div>
        <div class="ex-content">
          <div class="ex-top">
            <div class="ex-name">${ex.nome}</div>
            ${techniqueBadge(ex.tecnica)}
          </div>
          <div class="ex-stats">
            <div class="ex-stat"><span>🔁</span><span class="ex-stat-val">${ex.series}</span>&nbsp;<span>${ex.reps}</span></div>
            <div class="ex-stat"><span>⏱</span><span>Desc.: </span><span class="ex-stat-val">${ex.descanso||'60s'}</span></div>
          </div>
        </div>
      </div>
      ${imgSection}
      ${ex.tip?`<div class="ex-tip">💡 ${ex.tip}</div>`:''}
    </div>`;
}

function renderDayPanel(dayId){
  const d=TREINO[dayId];
  if(d.rest){
    return `<div class="day-panel" id="panel-${dayId}">
      <div class="day-header" style="--day-gradient:${d.gradient};--day-color:${d.cor}">
        <div class="day-header-content">
          <div class="day-badge">${d.icon} ${d.tipo}</div>
          <div class="day-title">${d.dayName}</div>
          <div class="day-subtitle">${d.subtitulo}</div>
        </div>
      </div>
      <div class="rest-card">
        <div class="rest-icon">${d.icon}</div>
        <div class="rest-title">Dia de Descanso</div>
        <div class="rest-sub">Recuperação é onde o músculo CRESCE.<br>Priorize sono (7–9h), hidratação e alimentação.</div>
      </div>
    </div>`;
  }

  let gi=0;
  const gruposHtml=d.grupos.map(g=>{
    const grpBadge=g.badge?`<span class="group-badge ${g.badge}">${g.badgeText}</span>`:'';
    const exsHtml=g.exercicios.map(ex=>renderExercise(ex,dayId,gi++,g.nome)).join('');
    return `<div class="muscle-group" id="grp-${dayId}-${g.nome.replace(/[^a-z0-9]/gi,'-')}">
      <div class="group-header" onclick="toggleGroup(this)">
        <span class="group-icon">${g.icon}</span>
        <div class="group-info">
          <div class="group-name">${g.nome}</div>
          <div class="group-count">${g.exercicios.length} exercícios</div>
        </div>
        ${grpBadge}
        <span class="group-toggle">▼</span>
      </div>
      <div class="group-progress-line" style="width:0%;background:${g.cor||d.cor}"></div>
      <div class="group-body">${exsHtml}</div>
    </div>`;
  }).join('');

  const totalEx=d.grupos.reduce((s,g)=>s+g.exercicios.length,0);
  return `<div class="day-panel" id="panel-${dayId}">
    <div class="day-header" style="--day-gradient:${d.gradient};--day-color:${d.cor}">
      <div class="day-header-content">
        <div class="day-badge">${d.icon} ${d.tipo}</div>
        <div class="day-title">${d.dayName}</div>
        <div class="day-subtitle">${d.subtitulo}</div>
        <div class="day-meta">
          <span>📊 ${totalEx} exercícios</span>
          <span>⏱ ~${Math.round(totalEx*3.5+10)} min</span>
          <span>💪 ${d.grupos.length} grupos</span>
        </div>
      </div>
    </div>
    <div class="day-progress" id="progress-${dayId}">
      <div class="progress-header">
        <span class="progress-label">Progresso do Treino</span>
        <span class="progress-pct" id="pct-${dayId}">0%</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="bar-${dayId}" style="width:0%;background:${d.gradient}"></div>
      </div>
      <div class="progress-counts">
        <span id="count-${dayId}">0 / ${totalEx} exercícios</span>
        <span id="status-${dayId}">💪 Bora!</span>
      </div>
    </div>
    <div class="completion-banner" id="complete-${dayId}">
      <div class="completion-icon">🏆</div>
      <div class="completion-title">Treino Concluído!</div>
      <div class="completion-sub">Você arrasou hoje! Descanse bem e coma bem. 💪🔥</div>
    </div>
    ${gruposHtml}
  </div>`;
}

/* ══════════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════════ */
function renderAll(){
  const nav=document.getElementById('dayNav');
  const main=document.getElementById('mainContent');
  nav.innerHTML='';main.innerHTML='';
  DAYS_ORDER.forEach(dayId=>{
    const d=TREINO[dayId];
    const{done,total}=getDayProgress(dayId);
    const completed=!d.rest&&total>0&&done>=total;
    const btn=document.createElement('button');
    btn.className='day-btn'+(dayId===currentDay?' active':'')+(completed?' completed':'');
    btn.style.setProperty('--accent-day',d.cor);
    btn.innerHTML=`<span>${d.label}</span><span style="font-size:.6rem;opacity:.7">${d.tipo.split(' ')[0]}</span><span class="done-dot"></span>`;
    btn.onclick=()=>switchDay(dayId);
    nav.appendChild(btn);
    const wrap=document.createElement('div');
    wrap.innerHTML=renderDayPanel(dayId);
    main.appendChild(wrap.firstChild);
  });
  activateDay(currentDay);
}

function activateDay(dayId){
  currentDay=dayId;
  document.querySelectorAll('.day-btn').forEach((b,i)=>b.classList.toggle('active',DAYS_ORDER[i]===dayId));
  document.querySelectorAll('.day-panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById(`panel-${dayId}`);
  if(panel)panel.classList.add('active');
  updateProgress(dayId);
  updateBottomBar(dayId);
  const btns=document.querySelectorAll('.day-btn');
  const idx=DAYS_ORDER.indexOf(dayId);
  if(btns[idx])btns[idx].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}

function switchDay(dayId){
  activateDay(dayId);
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleExercise(dayId,idx){
  const card=document.getElementById(`ex-${dayId}-${idx}`);
  if(!card)return;
  const nowDone=!card.classList.contains('done');
  setDone(dayId,idx,nowDone);
  card.classList.toggle('done',nowDone);
  updateProgress(dayId);
  updateGroupProgress(dayId);
  updateNavDots();
}

function updateProgress(dayId){
  const d=TREINO[dayId];if(!d||d.rest)return;
  const{done,total}=getDayProgress(dayId);
  const pct=total>0?Math.round(done/total*100):0;
  const bar=document.getElementById(`bar-${dayId}`);
  if(bar)bar.style.width=pct+'%';
  const pctEl=document.getElementById(`pct-${dayId}`);
  if(pctEl)pctEl.textContent=pct+'%';
  const countEl=document.getElementById(`count-${dayId}`);
  if(countEl)countEl.textContent=`${done} / ${total} exercícios`;
  const statusEl=document.getElementById(`status-${dayId}`);
  if(statusEl)statusEl.textContent=pct===100?'🏆 Concluído!':pct>=50?'🔥 Mais da metade!':pct>0?'💪 Bora!':'💪 Bora treinar!';
  const banner=document.getElementById(`complete-${dayId}`);
  if(banner)banner.classList.toggle('show',pct===100);
  updateBottomBar(dayId);
}

function updateGroupProgress(dayId){
  const d=TREINO[dayId];if(!d||d.rest)return;
  let gi=0;
  d.grupos.forEach(g=>{
    const start=gi;
    let done=0;
    g.exercicios.forEach(()=>{if(isDone(dayId,gi++))done++;});
    const grpEl=document.getElementById(`grp-${dayId}-${g.nome.replace(/[^a-z0-9]/gi,'-')}`);
    if(grpEl){const line=grpEl.querySelector('.group-progress-line');if(line)line.style.width=(g.exercicios.length>0?Math.round(done/g.exercicios.length*100):0)+'%';}
  });
}

function updateNavDots(){
  document.querySelectorAll('.day-btn').forEach((b,i)=>{
    const d=TREINO[DAYS_ORDER[i]];if(d&&d.rest)return;
    const{done,total}=getDayProgress(DAYS_ORDER[i]);
    b.classList.toggle('completed',total>0&&done>=total);
  });
}

function updateBottomBar(dayId){
  const bar=document.getElementById('bottomBar');
  const d=TREINO[dayId];
  if(!d||d.rest){bar.style.display='none';return;}
  bar.style.display='flex';
  const{done,total}=getDayProgress(dayId);
  document.getElementById('bbTitle').textContent=`${d.label} — ${d.tipo}`;
  document.getElementById('bbSub').textContent=`${done} / ${total} exercícios`;
}

function toggleGroup(headerEl){headerEl.closest('.muscle-group').classList.toggle('group-collapsed');}

function markAllDone(){
  const d=TREINO[currentDay];if(!d||d.rest)return;
  let gi=0;
  d.grupos.forEach(g=>g.exercicios.forEach(()=>setDone(currentDay,gi++,true)));
  document.querySelectorAll(`[id^="ex-${currentDay}-"]`).forEach(c=>c.classList.add('done'));
  updateProgress(currentDay);updateGroupProgress(currentDay);updateNavDots();
}

function resetDay(){
  const d=TREINO[currentDay];if(!d||d.rest)return;
  if(!confirm(`Reiniciar treino de ${d.dayName}?`))return;
  let gi=0;
  d.grupos.forEach(g=>g.exercicios.forEach(()=>localStorage.removeItem(lsKey(currentDay,gi++))));
  document.querySelectorAll(`[id^="ex-${currentDay}-"]`).forEach(c=>c.classList.remove('done'));
  updateProgress(currentDay);updateGroupProgress(currentDay);updateNavDots();
}

function resetAll(){
  if(!confirm('Reiniciar TODO o progresso semanal?'))return;
  DAYS_ORDER.forEach(dayId=>{
    const d=TREINO[dayId];if(d.rest)return;
    let gi=0;
    d.grupos.forEach(g=>g.exercicios.forEach(()=>localStorage.removeItem(lsKey(dayId,gi++))));
  });
  renderAll();
}

/* ── Init ── */
renderAll();
updateNavDots();
DAYS_ORDER.forEach(d=>{ if(!TREINO[d].rest){updateProgress(d);updateGroupProgress(d);} });

const WEEKDAY={1:'segunda',2:'terca',3:'quarta',4:'quinta',5:'sexta',6:'sabado',0:'domingo'};
switchDay(WEEKDAY[new Date().getDay()]||'segunda');

// Fechar modal com ESC
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
</body>
