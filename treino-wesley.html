<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Treino Wesley — Hipertrofia</title>
<style>
/* ── Reset & Base ───────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D1117;--surface:#161B22;--surface2:#1C2128;--surface3:#22272E;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#E6EDF3;--muted:#7D8590;--dim:#484F58;
  --red:#EF4444;--blue:#3B82F6;--green:#22C55E;--amber:#F59E0B;
  --purple:#A855F7;--cyan:#06B6D4;--pink:#EC4899;
  --accent:#EF4444;
  --nav-h:56px;
}
html{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;scroll-behavior:smooth}
body{min-height:100vh;padding-bottom:calc(var(--nav-h) + 2rem)}

/* ── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:99px}

/* ── Header ─────────────────────────────────────────────── */
.app-header{
  background:rgba(13,17,23,.9);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:.85rem 1rem .5rem;
  position:sticky;top:0;z-index:100;
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem}
.header-brand{font-size:1rem;font-weight:800;letter-spacing:-.3px}
.header-brand span{
  background:linear-gradient(90deg,#EF4444,#F59E0B);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
}
.header-week{font-size:.72rem;color:var(--muted)}
.reset-btn{
  background:var(--surface2);border:1px solid var(--border2);
  color:var(--muted);font-size:.7rem;font-weight:600;
  padding:.3rem .65rem;border-radius:8px;cursor:pointer;
}
.reset-btn:hover{color:var(--text);background:var(--surface3)}

/* ── Day Nav ─────────────────────────────────────────────── */
.day-nav{
  display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none;-ms-overflow-style:none
}
.day-nav::-webkit-scrollbar{display:none}
.day-btn{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:.4rem .6rem;border-radius:10px;
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:.65rem;font-weight:700;letter-spacing:.5px;
  transition:background .15s,color .15s;
  position:relative;
}
.day-btn .day-abbr{font-size:.72rem}
.day-btn .day-type{font-size:.6rem;opacity:.7}
.day-btn:hover{background:var(--surface2);color:var(--text)}
.day-btn.active{background:var(--surface2);color:var(--text)}
.day-btn.active::after{
  content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
  width:24px;height:3px;border-radius:99px;background:var(--accent-day,var(--red))
}
.day-btn .done-dot{
  width:5px;height:5px;border-radius:50%;background:var(--green);
  position:absolute;top:4px;right:4px;display:none
}
.day-btn.completed .done-dot{display:block}

/* ── Main Content ────────────────────────────────────────── */
.main{padding:1rem;max-width:640px;margin:0 auto}

/* ── Day Panel ────────────────────────────────────────────── */
.day-panel{display:none;animation:fadeUp .2s ease}
.day-panel.active{display:block}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

/* ── Day Header ───────────────────────────────────────────── */
.day-header{
  border-radius:16px;padding:1.25rem 1.25rem 1rem;
  margin-bottom:1rem;
  border:1px solid var(--border);
  position:relative;overflow:hidden;
}
.day-header::before{
  content:'';position:absolute;inset:0;
  background:var(--day-gradient);opacity:.12;
}
.day-header-content{position:relative}
.day-badge{
  display:inline-flex;align-items:center;gap:.35rem;
  background:rgba(255,255,255,.08);border:1px solid var(--border2);
  padding:.2rem .6rem;border-radius:99px;
  font-size:.62rem;font-weight:800;letter-spacing:1px;
  color:var(--day-color);margin-bottom:.5rem;
}
.day-title{font-size:1.5rem;font-weight:900;letter-spacing:-.5px;margin-bottom:.15rem}
.day-subtitle{font-size:.8rem;color:var(--muted)}
.day-meta{
  display:flex;gap:.75rem;margin-top:.75rem;
  font-size:.72rem;color:var(--muted)
}
.day-meta span{display:flex;align-items:center;gap:.25rem}

/* ── Progress Bar ─────────────────────────────────────────── */
.day-progress{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:.85rem 1rem;margin-bottom:1rem;
}
.progress-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem}
.progress-label{font-size:.75rem;font-weight:700}
.progress-pct{font-size:.72rem;color:var(--muted)}
.progress-bar-wrap{height:6px;background:var(--surface3);border-radius:99px;overflow:hidden}
.progress-bar-fill{
  height:100%;border-radius:99px;
  background:var(--day-gradient);
  transition:width .4s cubic-bezier(.4,0,.2,1);
}
.progress-counts{display:flex;justify-content:space-between;margin-top:.4rem;font-size:.68rem;color:var(--muted)}

/* ── Muscle Group ─────────────────────────────────────────── */
.muscle-group{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;margin-bottom:.85rem;overflow:hidden;
}
.group-header{
  display:flex;align-items:center;gap:.65rem;
  padding:.9rem 1rem;border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;
}
.group-icon{font-size:1.2rem;line-height:1;flex-shrink:0}
.group-info{flex:1;min-width:0}
.group-name{font-size:.88rem;font-weight:800;color:var(--text)}
.group-count{font-size:.7rem;color:var(--muted);margin-top:1px}
.group-badge{
  font-size:.58rem;font-weight:800;letter-spacing:.8px;
  padding:.18rem .55rem;border-radius:99px;white-space:nowrap;flex-shrink:0;
}
.badge-priority{background:rgba(239,68,68,.15);color:#EF4444;border:1px solid rgba(239,68,68,.3)}
.badge-superset{background:rgba(168,85,247,.15);color:#A855F7;border:1px solid rgba(168,85,247,.3)}
.badge-volume{background:rgba(59,130,246,.15);color:#60A5FA;border:1px solid rgba(59,130,246,.3)}
.badge-power{background:rgba(245,158,11,.15);color:#F59E0B;border:1px solid rgba(245,158,11,.3)}

.group-toggle{color:var(--muted);font-size:.9rem;transition:transform .2s;flex-shrink:0}
.group-collapsed .group-toggle{transform:rotate(-90deg)}
.group-collapsed .group-body{display:none}

.group-progress-line{
  height:3px;background:var(--group-color,var(--red));
  transition:width .3s ease;border-radius:0 0 0 0;
}

/* ── Exercise Cards ──────────────────────────────────────── */
.group-body{padding:.5rem .6rem .6rem}

.exercise-card{
  display:flex;align-items:flex-start;gap:.7rem;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:.75rem .9rem;margin-top:.4rem;
  transition:background .2s,border-color .2s,opacity .3s;
  cursor:pointer;
}
.exercise-card:hover{background:var(--surface3)}
.exercise-card.done{
  opacity:.5;
  background:rgba(34,197,94,.04);
  border-color:rgba(34,197,94,.15);
}
.exercise-card.done .ex-name{text-decoration:line-through;color:var(--muted)}

/* Checkbox */
.ex-check{
  width:22px;height:22px;border-radius:6px;
  border:2px solid var(--border2);
  background:none;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s;
}
.exercise-card.done .ex-check{
  background:var(--green);border-color:var(--green);
}
.ex-check-mark{color:#fff;font-size:.75rem;opacity:0;transition:opacity .2s}
.exercise-card.done .ex-check-mark{opacity:1}

/* Content */
.ex-content{flex:1;min-width:0}
.ex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.35rem}
.ex-name{font-size:.88rem;font-weight:700;color:var(--text);line-height:1.3}
.ex-technique{
  font-size:.55rem;font-weight:800;letter-spacing:.7px;
  padding:.15rem .45rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:1px;
}
.tech-drop{background:rgba(239,68,68,.2);color:#EF4444;border:1px solid rgba(239,68,68,.35)}
.tech-rest{background:rgba(245,158,11,.2);color:#F59E0B;border:1px solid rgba(245,158,11,.35)}
.tech-super{background:rgba(168,85,247,.2);color:#A855F7;border:1px solid rgba(168,85,247,.35)}
.tech-giant{background:rgba(236,72,153,.2);color:#EC4899;border:1px solid rgba(236,72,153,.35)}
.tech-heavy{background:rgba(6,182,212,.2);color:#06B6D4;border:1px solid rgba(6,182,212,.35)}
.tech-prog{background:rgba(34,197,94,.2);color:#22C55E;border:1px solid rgba(34,197,94,.35)}

.ex-stats{display:flex;flex-wrap:wrap;gap:.4rem .8rem}
.ex-stat{
  display:flex;align-items:center;gap:.25rem;
  font-size:.72rem;color:var(--muted);
}
.ex-stat-icon{font-size:.75rem}
.ex-stat-val{font-weight:600;color:var(--text)}

.ex-tip{
  margin-top:.45rem;padding:.4rem .6rem;
  background:rgba(255,255,255,.03);border-left:2px solid var(--border2);
  border-radius:0 6px 6px 0;
  font-size:.7rem;color:var(--muted);line-height:1.45;
}

/* ── Completion Banner ──────────────────────────────────── */
.completion-banner{
  display:none;
  background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(6,182,212,.1));
  border:1px solid rgba(34,197,94,.3);
  border-radius:16px;padding:1.25rem;text-align:center;
  margin-bottom:1rem;animation:fadeUp .4s ease;
}
.completion-banner.show{display:block}
.completion-icon{font-size:2rem;margin-bottom:.4rem}
.completion-title{font-size:1rem;font-weight:800;color:var(--green);margin-bottom:.25rem}
.completion-sub{font-size:.8rem;color:var(--muted)}

/* ── Rest day ─────────────────────────────────────────────── */
.rest-card{
  text-align:center;padding:3rem 1rem;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
}
.rest-icon{font-size:3rem;margin-bottom:.75rem}
.rest-title{font-size:1.1rem;font-weight:800;margin-bottom:.4rem}
.rest-sub{font-size:.8rem;color:var(--muted)}

/* ── Bottom Nav ──────────────────────────────────────────── */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(13,17,23,.95);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding:.5rem .75rem;
  padding-bottom:calc(.5rem + env(safe-area-inset-bottom));
  display:flex;gap:.4rem;align-items:center;justify-content:space-between;
  z-index:200;
}
.bb-info{
  display:flex;flex-direction:column;
  font-size:.68rem;color:var(--muted);
  min-width:0;flex:1;
}
.bb-info-title{font-weight:700;color:var(--text);font-size:.75rem}
.bb-info-sub{margin-top:1px}
.bb-actions{display:flex;gap:.5rem;flex-shrink:0}
.bb-btn{
  display:flex;align-items:center;gap:.3rem;
  padding:.45rem .85rem;border-radius:10px;
  font-size:.72rem;font-weight:700;
  border:none;cursor:pointer;transition:opacity .2s,transform .15s;
}
.bb-btn:active{transform:scale(.96)}
.bb-btn-day{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border2);
}
.bb-btn-done{
  background:linear-gradient(135deg,var(--green),#16A34A);color:#fff;
}
.bb-btn:hover{opacity:.85}

/* ── Swipe hint ──────────────────────────────────────────── */
.swipe-hint{
  text-align:center;padding:.6rem;
  font-size:.65rem;color:var(--dim);margin-bottom:.5rem;
}

/* ── Responsive ──────────────────────────────────────────── */
@media(min-width:600px){
  .main{padding:1.25rem 1.5rem}
  .day-title{font-size:1.75rem}
}
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header class="app-header">
  <div class="header-top">
    <div class="header-brand">🏋️ <span>Wesley</span> — Hipertrofia</div>
    <button class="reset-btn" onclick="resetAll()">🔄 Reiniciar semana</button>
  </div>
  <nav class="day-nav" id="dayNav">
    <!-- injetado via JS -->
  </nav>
</header>

<!-- ══ MAIN ══ -->
<main class="main" id="mainContent">
  <div class="swipe-hint">Selecione o dia acima para ver seu treino ↑</div>
  <!-- painéis injetados via JS -->
</main>

<!-- ══ BOTTOM BAR ══ -->
<div class="bottom-bar" id="bottomBar" style="display:none">
  <div class="bb-info">
    <div class="bb-info-title" id="bbTitle">—</div>
    <div class="bb-info-sub" id="bbSub">0 / 0 exercícios</div>
  </div>
  <div class="bb-actions">
    <button class="bb-btn bb-btn-day" onclick="resetDay()">🔄 Reiniciar</button>
    <button class="bb-btn bb-btn-done" onclick="markAllDone()">✓ Concluir tudo</button>
  </div>
</div>

<script>

const DAYS_ORDER = ['segunda','terca','quarta','quinta','sexta','sabado','domingo'];
let currentDay = 'segunda';

function lsKey(day, exIdx){ return `treino_w_${day}_${exIdx}`; }
function isDone(day, exIdx){ return localStorage.getItem(lsKey(day,exIdx)) === '1'; }
function setDone(day, exIdx, val){ localStorage.setItem(lsKey(day,exIdx), val?'1':'0'); }
function getDayProgress(dayId){
  const d = TREINO[dayId]; if(!d||d.rest) return {done:0,total:0};
  let total=0,done=0;
  d.grupos.forEach(g=>g.exercicios.forEach((_,i)=>{ total++; if(isDone(dayId,getExGlobalIdx(dayId,g,i))) done++; }));
  return {done,total};
}
function getExGlobalIdx(dayId, grupo, exInGroupIdx){
  const d=TREINO[dayId]; let idx=0;
  for(const g of d.grupos){
    if(g===grupo) return idx+exInGroupIdx;
    idx+=g.exercicios.length;
  }
  return exInGroupIdx;
}

function techniqueBadge(t){
  if(!t) return '';
  const map={
    'DROP': ['tech-drop','DROP SET'],
    'REST': ['tech-rest','REST-PAUSE'],
    'SUPER': ['tech-super','SUPERSET'],
    'GIANT': ['tech-giant','GIANT SET'],
    'HEAVY': ['tech-heavy','PESADO'],
    'PROG': ['tech-prog','PROGRESSÃO'],
  };
  const [cls,label]=map[t]||['tech-prog',t];
  return `<span class="ex-technique ${cls}">${label}</span>`;
}

function renderDayPanel(dayId){
  const d = TREINO[dayId];
  if(d.rest){
    return `<div class="day-panel" id="panel-${dayId}">
      <div class="day-header" style="--day-gradient:${d.gradient};--day-color:${d.cor}">
        <div class="day-header-content">
          <div class="day-badge">${d.icon} ${d.tipo}</div>
          <div class="day-title">${d.dayName}</div>
          <div class="day-subtitle">${d.subtitulo}</div>
        </div>
      </div>
      <div class="rest-card">
        <div class="rest-icon">${d.icon}</div>
        <div class="rest-title">Dia de Descanso</div>
        <div class="rest-sub">Recuperação é onde o músculo CRESCE.<br>Priorize sono (7–9h), hidratação e alimentação.</div>
      </div>
    </div>`;
  }

  let globalIdx = 0;
  const gruposHtml = d.grupos.map(g => {
    const exsHtml = g.exercicios.map((ex,i) => {
      const gi = globalIdx++;
      const done = isDone(dayId, gi);
      return `<div class="exercise-card${done?' done':''}" data-day="${dayId}" data-idx="${gi}" onclick="toggleExercise('${dayId}',${gi})">
        <div class="ex-check"><span class="ex-check-mark">✓</span></div>
        <div class="ex-content">
          <div class="ex-top">
            <div class="ex-name">${ex.nome}</div>
            ${techniqueBadge(ex.tecnica)}
          </div>
          <div class="ex-stats">
            <div class="ex-stat"><span class="ex-stat-icon">🔁</span><span class="ex-stat-val">${ex.series}</span>&nbsp;<span>${ex.reps}</span></div>
            <div class="ex-stat"><span class="ex-stat-icon">⏱</span><span>Descanso: </span><span class="ex-stat-val">${ex.descanso||'60s'}</span></div>
          </div>
          ${ex.tip?`<div class="ex-tip">💡 ${ex.tip}</div>`:''}
        </div>
      </div>`;
    }).join('');

    const grpBadge = g.badge?`<span class="group-badge ${g.badge}">${g.badgeText}</span>`:'';
    return `<div class="muscle-group" id="grp-${dayId}-${g.nome.replace(/\s+/g,'-')}">
      <div class="group-header" onclick="toggleGroup(this)">
        <span class="group-icon">${g.icon}</span>
        <div class="group-info">
          <div class="group-name">${g.nome}</div>
          <div class="group-count">${g.exercicios.length} exercícios</div>
        </div>
        ${grpBadge}
        <span class="group-toggle">▼</span>
      </div>
      <div class="group-progress-line" style="width:0%;background:${g.cor||d.cor}"></div>
      <div class="group-body">${exsHtml}</div>
    </div>`;
  }).join('');

  return `<div class="day-panel" id="panel-${dayId}">
    <div class="day-header" style="--day-gradient:${d.gradient};--day-color:${d.cor}">
      <div class="day-header-content">
        <div class="day-badge">${d.icon} ${d.tipo}</div>
        <div class="day-title">${d.dayName}</div>
        <div class="day-subtitle">${d.subtitulo}</div>
        <div class="day-meta">
          <span>📊 ${countTotalEx(dayId)} exercícios</span>
          <span>⏱ ~${estimateTime(dayId)} min</span>
          <span>💪 ${countGroups(dayId)} grupos</span>
        </div>
      </div>
    </div>
    <div class="day-progress" id="progress-${dayId}">
      <div class="progress-header">
        <span class="progress-label">Progresso do Treino</span>
        <span class="progress-pct" id="pct-${dayId}">0%</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="bar-${dayId}" style="width:0%;background:${d.gradient}"></div>
      </div>
      <div class="progress-counts">
        <span id="count-${dayId}">0 / ${countTotalEx(dayId)} exercícios concluídos</span>
        <span id="status-${dayId}">💪 Bora treinar!</span>
      </div>
    </div>
    <div class="completion-banner" id="complete-${dayId}">
      <div class="completion-icon">🏆</div>
      <div class="completion-title">Treino Concluído!</div>
      <div class="completion-sub">Você arrasou hoje! Descanse bem e coma bem. 💪🔥</div>
    </div>
    ${gruposHtml}
  </div>`;
}

function countTotalEx(dayId){
  return TREINO[dayId].grupos.reduce((s,g)=>s+g.exercicios.length,0);
}
function estimateTime(dayId){
  const total=countTotalEx(dayId);
  return Math.round(total*3.5+10);
}
function countGroups(dayId){ return TREINO[dayId].grupos.length; }

function renderAll(){
  const nav = document.getElementById('dayNav');
  const main = document.getElementById('mainContent');
  nav.innerHTML=''; main.innerHTML='';

  DAYS_ORDER.forEach(dayId => {
    const d=TREINO[dayId];
    const {done,total}=getDayProgress(dayId);
    const completed = !d.rest && total>0 && done>=total;
    const btn=document.createElement('button');
    btn.className='day-btn'+(dayId===currentDay?' active':'')+(completed?' completed':'');
    btn.style.setProperty('--accent-day', d.cor);
    btn.innerHTML=`<span class="day-abbr">${d.label}</span><span class="day-type">${d.tipo.split(' ')[0]}</span><span class="done-dot"></span>`;
    btn.onclick=()=>switchDay(dayId);
    nav.appendChild(btn);

    const panel=document.createElement('div');
    panel.innerHTML=renderDayPanel(dayId);
    main.appendChild(panel.firstChild);
  });

  activateDay(currentDay);
}

function activateDay(dayId){
  currentDay=dayId;
  document.querySelectorAll('.day-btn').forEach((b,i)=>{
    b.classList.toggle('active', DAYS_ORDER[i]===dayId);
  });
  document.querySelectorAll('.day-panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById(`panel-${dayId}`);
  if(panel) panel.classList.add('active');

  updateProgress(dayId);
  updateBottomBar(dayId);

  // Scroll nav to active
  const btns=document.querySelectorAll('.day-btn');
  const idx=DAYS_ORDER.indexOf(dayId);
  if(btns[idx]) btns[idx].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}

function switchDay(dayId){
  activateDay(dayId);
  document.getElementById('mainContent').scrollTop=0;
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleExercise(dayId, idx){
  const card=document.querySelector(`.exercise-card[data-day="${dayId}"][data-idx="${idx}"]`);
  if(!card) return;
  const nowDone=!card.classList.contains('done');
  setDone(dayId,idx,nowDone);
  card.classList.toggle('done',nowDone);
  updateProgress(dayId);
  updateGroupProgress(dayId);
  updateNavDots();
}

function updateProgress(dayId){
  const d=TREINO[dayId]; if(!d||d.rest) return;
  const {done,total}=getDayProgress(dayId);
  const pct=total>0?Math.round(done/total*100):0;
  const bar=document.getElementById(`bar-${dayId}`);
  const pctEl=document.getElementById(`pct-${dayId}`);
  const countEl=document.getElementById(`count-${dayId}`);
  const statusEl=document.getElementById(`status-${dayId}`);
  const banner=document.getElementById(`complete-${dayId}`);
  if(bar) bar.style.width=pct+'%';
  if(pctEl) pctEl.textContent=pct+'%';
  if(countEl) countEl.textContent=`${done} / ${total} exercícios concluídos`;
  if(statusEl){
    if(pct===100) statusEl.textContent='🏆 Concluído!';
    else if(pct>=50) statusEl.textContent='🔥 Mais da metade!';
    else if(pct>0) statusEl.textContent='💪 Bora!';
    else statusEl.textContent='💪 Bora treinar!';
  }
  if(banner) banner.classList.toggle('show',pct===100);
  updateBottomBar(dayId);
}

function updateGroupProgress(dayId){
  const d=TREINO[dayId]; if(!d||d.rest) return;
  let gIdx=0;
  d.grupos.forEach(g=>{
    const total=g.exercicios.length;
    let done=0;
    g.exercicios.forEach((_,i)=>{ if(isDone(dayId,gIdx+i)) done++; });
    const grpEl=document.getElementById(`grp-${dayId}-${g.nome.replace(/\s+/g,'-')}`);
    if(grpEl){
      const line=grpEl.querySelector('.group-progress-line');
      if(line) line.style.width=(total>0?Math.round(done/total*100):0)+'%';
    }
    gIdx+=total;
  });
}

function updateNavDots(){
  document.querySelectorAll('.day-btn').forEach((b,i)=>{
    const dayId=DAYS_ORDER[i];
    const d=TREINO[dayId]; if(d.rest) return;
    const {done,total}=getDayProgress(dayId);
    b.classList.toggle('completed',total>0&&done>=total);
  });
}

function updateBottomBar(dayId){
  const bar=document.getElementById('bottomBar');
  const d=TREINO[dayId];
  if(!d||d.rest){bar.style.display='none';return;}
  bar.style.display='flex';
  const {done,total}=getDayProgress(dayId);
  document.getElementById('bbTitle').textContent=`${d.label} — ${d.tipo}`;
  document.getElementById('bbSub').textContent=`${done} / ${total} exercícios`;
}

function toggleGroup(headerEl){
  const group=headerEl.closest('.muscle-group');
  group.classList.toggle('group-collapsed');
}

function markAllDone(){
  const d=TREINO[currentDay]; if(!d||d.rest) return;
  let idx=0;
  d.grupos.forEach(g=>g.exercicios.forEach((_,i)=>{
    setDone(currentDay,idx+i,true);
  }));
  // refresh
  document.querySelectorAll(`.exercise-card[data-day="${currentDay}"]`).forEach(c=>c.classList.add('done'));
  updateProgress(currentDay);
  updateGroupProgress(currentDay);
  updateNavDots();
}

function resetDay(){
  const d=TREINO[currentDay]; if(!d||d.rest) return;
  if(!confirm(`Reiniciar treino de ${d.dayName}?`)) return;
  let idx=0;
  d.grupos.forEach(g=>g.exercicios.forEach((_,i)=>{
    localStorage.removeItem(lsKey(currentDay,idx+i));
    idx++;
  }));
  document.querySelectorAll(`.exercise-card[data-day="${currentDay}"]`).forEach(c=>c.classList.remove('done'));
  updateProgress(currentDay);
  updateGroupProgress(currentDay);
  updateNavDots();
}

function resetAll(){
  if(!confirm('Reiniciar TODO o progresso semanal?')) return;
  DAYS_ORDER.forEach(dayId=>{
    const d=TREINO[dayId]; if(d.rest) return;
    let idx=0;
    d.grupos.forEach(g=>g.exercicios.forEach((_,i)=>{ localStorage.removeItem(lsKey(dayId,idx+i)); idx++; }));
  });
  renderAll();
}

/* ── Init ── */
renderAll();
updateNavDots();
